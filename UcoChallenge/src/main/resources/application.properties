spring.config.import=optional:file:.env[.properties]

spring.application.name=UcoChallenge

spring.datasource.url= ${spring--datasource--url}
spring.datasource.username=${spring--datasource--username}
spring.datasource.password=${spring--datasource--password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.ssl=true

logging.level.org.springframework.jdbc.core=DEBUG
server.port=8080

# Dominio de su Auth0.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth0-issuer}

# El identificador de su API (Resource Server), que debe ser requerido por el decoder.
spring.security.oauth2.resourceserver.jwt.audience=${auth0-audience}

# Cabecera compartida con el gateway para llamadas internas.
gateway.security.header=X-Gateway-Request
gateway.security.secret=${gateway-secret}


# Key Vault
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://ucochallenge-bs.vault.azure.net/


# Credenciales globales del SP (mándalas por ENV; aquí solo las claves)
# Asegura que el mecanismo de Key Vault esta habilitado
spring.cloud.azure.keyvault.secret.property-source-enabled=true

# --- Notificaciones Catalog ---
notifications.api.base-url=${NOTIFICATIONS_API_BASE_URL:http://localhost:8084/notifications/api/v1}

# --- Message Catalog ---
messages.catalog.base-url=${MESSAGES_CATALOG_BASE_URL:http://localhost:8083/messages/api/v1/messages}

# --- Parameters Catalog ---
parameters.catalog.base-url=${PARAMETERS_CATALOG_BASE_URL:http://localhost:8082}

# Cache
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:rediss://default:AU7sAAIncDI5YWYzZjJiZDA2ZjI0YTNiYTNiMDE2YWM4ZGY5ZGJhM3AyMjAyMDQ@real-eft-20204.upstash.io:6379}
spring.data.redis.host=${REDIS_HOST:real-eft-20204.upstash.io}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME: default}
spring.data.redis.password=${REDIS_PASSWORD:AU7sAAIncDI5YWYzZjJiZDA2ZjI0YTNiYTNiMDE2YWM4ZGY5ZGJhM3AyMjAyMDQ}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false


# Notification API
notification.api.client-id=${notification--api--client-id}
notification.api.client-secret=${notification--api--client-secret}


# Observabilidad - OpenTelemetry / Datadog
otel.java.global-autoconfigure.enabled=true
# Permite desactivar la instrumentación cuando no exista un agente disponible.
otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
# Apunta al Datadog Agent (por defecto localhost o el hostname del contenedor datadog-agent)
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://${OTEL_EXPORTER_OTLP_HOST:localhost}:${OTEL_EXPORTER_OTLP_PORT:4318}}
otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
# Exporta trazas y métricas hacia Datadog vía OTLP. Cambia a "none" si no hay agente disponible.
otel.metrics.exporter=${OTEL_METRICS_EXPORTER:otlp}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:otlp}
otel.logs.exporter=${OTEL_LOGS_EXPORTER:none}
otel.resource.attributes=service.name=${OTEL_SERVICE_NAME:${spring.application.name}},service.version=${OTEL_SERVICE_VERSION:0.0.1},deployment.environment=${OTEL_ENV:local}
otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS:}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}


